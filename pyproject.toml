[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-ack-system"
version = "0.1.0"
description = "Traceable supplier acknowledgement and downstream schedule impact workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.3.5",
  "PyYAML==6.0.2",
  "matplotlib==3.10.8",
  "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[project.scripts]
supplier-ack = "supplier_ack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=supplier_ack --cov-report=term-missing"
markers = [
  "slow: seeded full-data or subprocess reproducibility test",
  "e2e: end-to-end demo integration test",
]
