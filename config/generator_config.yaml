      packaging:
        default_uom: BOX
        min_unit_price: 15.0
        max_unit_price: 650.0
        names:
          - Corrugated Shipping Carton
          - ESD-Safe Component Box
          - Heavy-Duty Stretch Film Roll
          - Anti-Static Bubble Wrap
          - Reusable Plastic Tote
          - Pallet Corner Protector
          - Moisture Barrier Bag
          - Printed Supplier Label Pack
          - Industrial Foam Insert Set
          - Reinforced Packing Strap Roll
# Generation Step 4: explicit volume targets and realized coverage mix.
# `event_count` in each scale counts acknowledgement rows (all revisions) +
# change-request rows. Supplier silence has no acknowledgement row by design.
coverage:
  as_of_date: '2026-10-28'
  target_proportions:
    partial_acceptance: 0.22        # among responding POs, latest ACK outcome
    full_acceptance: 0.70           # among responding POs, latest ACK outcome
    full_rejection: 0.08            # among responding POs, latest ACK outcome
    date_slips: 0.30                # among latest line-level PromiseDate rows
    on_time_promises: 0.70          # among latest line-level PromiseDate rows
    price_changes: 0.06             # among accepted/partially accepted PO lines
    supplier_silence: 0.05          # among all POs; no ACK row is created
    multiple_revisions: 0.08        # among all POs; 2–4 ACK rows for selected POs
  acknowledgement_revisions:
    min_revisions: 2
    max_revisions: 4
    count_probabilities:
      2: 0.50
      3: 0.35
      4: 0.15
    revision_step_min_days: 1
    revision_step_max_days: 2
  acknowledgement_outcomes:
    partial_acceptance_beta_concentration: 10.0
    reliability_effect: 0.25
    large_quantity_effect: 0.08
    risk_noise_sd: 0.12
    rejection_reason_weights:
      capacity: 0.34
      price: 0.14
      stock: 0.34
      logistics: 0.18
  promise_dates:
    slip_days_lognormal_mean: 1.90
    slip_days_lognormal_sigma: 0.60
    min_slip_days: 3
    max_slip_days: 60
    on_time_early_days_beta_alpha: 2.0
    on_time_early_days_beta_beta: 5.0
    max_early_days: 5
    slip_risk_noise_sd: 0.15
    sources:
      SUPPLIER_PORTAL: 0.55
      EMAIL: 0.20
      EDI: 0.15
      API: 0.07
      MANUAL: 0.03
  price_changes:
    increase_probability: 0.78           # upward skew is deliberate
    magnitude_min_pct: 0.5
    magnitude_max_pct: 15.0
    magnitude_beta_alpha: 2.0            # most changes cluster below the maximum
    magnitude_beta_beta: 3.5
    risk_noise_sd: 0.10
  change_requests:
    # PRICE_CHANGE rows are emitted first; overdue-silence date requests are
    # reserved next; these weights allocate the remaining non-silence budget.
    non_price_type_weights:
      QUANTITY_CHANGE: 0.50
      DATE_CHANGE: 0.50
