# Seeded synthetic data generation. The same generator code path serves both scales.
seed: 20261022

scales:
  starter:
    supplier_count: 40
    po_count: 200
    event_count: 300
    item_count: 50
    warehouse_count: 4
    carrier_count: 10
    planner_count: 6
    carrier_warehouse_operator_count: 4
    logistics_analyst_count: 3
    operations_manager_count: 2
  full:
    supplier_count: 200
    po_count: 10000
    event_count: 15000
    item_count: 50
    warehouse_count: 8
    carrier_count: 20
    planner_count: 12
    carrier_warehouse_operator_count: 20
    logistics_analyst_count: 6
    operations_manager_count: 4

# Changes within the planner thresholds are approved at planner level.
# Changes outside those thresholds require operations_manager approval.
# Hard limits are deterministic reject rules after the required escalation.
approval_thresholds:
  price_change_pct: 5.0       # absolute price delta, percent
  date_slip_days: 7           # positive calendar-day slip
  quantity_change_pct: 10.0   # absolute quantity delta, percent
  max_price_change_pct: 15.0
  max_date_slip_days: 30
  max_quantity_change_pct: 50.0

distributions:
  default_currency: INR
  supplier_lead_time:
    regular_probability: 0.82
    regular_min_days: 7
    regular_max_days: 30
    tail_min_days: 31
    tail_max_days: 90
  supplier_reliability:
    low_reliability_probability: 0.08
    reliable_beta_alpha: 8.0
    reliable_beta_beta: 2.0
    unreliable_beta_alpha: 2.0
    unreliable_beta_beta: 5.0
    on_time_reliability_weight: 0.60
    on_time_noise_beta_alpha: 8.0
    on_time_noise_beta_beta: 2.0
  supplier_status:
    ACTIVE: 0.94
    ON_HOLD: 0.04
    BLOCKED: 0.015
    INACTIVE: 0.005
  supplier_sampling:
    pareto_alpha: 1.15
  preferred_carrier:
    preferred_probability: 0.78
  order_calendar:
    start_date: '2026-01-01'
    end_date: '2026-06-30'
    min_delivery_buffer_days: 2
    max_delivery_buffer_days: 7
    supplier_response_due_days: 2
    created_hour_utc: 9
    due_hour_utc: 17
  po_lines:
    min_lines_per_po: 2
    max_lines_per_po: 6
    quantity_lognormal_mean: 5.8
    quantity_lognormal_sigma: 0.85
    quantity_min: 10
    quantity_max: 5000
  item_catalog:
    categories:
      fasteners:
        default_uom: EA
        min_unit_price: 5.0
        max_unit_price: 100.0
        names:
          - Stainless Steel Hex Bolt M6
          - Galvanized Hex Bolt M8
          - Stainless Steel Lock Nut M6
          - Zinc-Plated Flat Washer M8
          - Spring Washer M10
          - Carbon Steel Threaded Rod
          - Stainless Steel Set Screw
          - Heavy-Duty Anchor Bolt
          - Nylon Lock Nut M12
          - Brass Machine Screw
      bearings:
        default_uom: EA
        min_unit_price: 80.0
        max_unit_price: 2500.0
        names:
          - Deep-Groove Ball Bearing 6202
          - Tapered Roller Bearing 30204
          - Stainless Pillow Block Bearing
          - Needle Roller Bearing NK20
          - Thrust Ball Bearing 51105
          - Spherical Roller Bearing 22208
          - Flanged Ball Bearing UCFL204
          - Miniature Precision Bearing
          - Cylindrical Roller Bearing NJ205
          - Sealed Radial Bearing 6305
      electrical:
        default_uom: EA
        min_unit_price: 20.0
        max_unit_price: 1800.0
        names:
          - Industrial Relay 24V DC
          - Copper Cable Lug 16mm
          - IP65 Cable Gland M20
          - Three-Phase Contactor 32A
          - Panel-Mount Circuit Breaker
          - Proximity Sensor M12
          - Industrial Terminal Block
          - Shielded Control Cable 10m
          - DIN-Rail Power Supply 24V
          - Emergency Stop Push Button
      fluid_handling:
        default_uom: L
        min_unit_price: 25.0
        max_unit_price: 950.0
        names:
          - Hydraulic Oil ISO 46
          - Food-Grade Lubricant
          - Industrial Coolant Concentrate
          - Pneumatic Hose 10mm
          - Stainless Steel Ball Valve
          - High-Pressure Pipe Coupling
          - PTFE Gasket Sheet
          - Chemical-Resistant Seal Kit
