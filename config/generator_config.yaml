# Every generation and business-rule knob lives here. Starter and full scales use
# the same generator implementation; only scale parameters differ.
seed: 20261022

scales:
  starter:
    po_count: 200
    event_count: 300
  full:
    po_count: 10000
    event_count: 15000

approval_thresholds:
  # Absolute percentage change compared with the original PO line value/quantity.
  price_change_pct: 5.0
  # A promised date slip above this many calendar days requires approval.
  date_slip_days: 3
  # Absolute percentage quantity change compared with the ordered quantity.
  quantity_change_pct: 10.0
  # Additional guardrails used by the workflow.
  max_date_slip_days: 30
  max_quantity_change_pct: 50.0
  require_approval_for_cancel: true

distributions:
  supplier_count: 120
  item_count: 500
  warehouse_count: 8
  carrier_count: 20
  planner_count: 12
  logistics_analyst_count: 6
  operations_manager_count: 4
  supplier_acknowledgement:
    acknowledged_probability: 0.72
    rejected_probability: 0.06
    pending_probability: 0.22
  quantity_change:
    no_change_probability: 0.70
    decrease_probability: 0.16
    increase_probability: 0.14
    min_change_pct: 2.0
    max_change_pct: 35.0
  promised_date_slip_days:
    on_time_probability: 0.58
    early_probability: 0.08
    delayed_probability: 0.34
    early_min_days: 1
    early_max_days: 5
    delayed_min_days: 1
    delayed_max_days: 21
  price_change_pct:
    no_change_probability: 0.90
    changed_min_pct: 1.0
    changed_max_pct: 12.0
  event_types:
    acknowledgement_received: 0.28
    promised_date_updated: 0.22
    quantity_change_requested: 0.16
    price_change_requested: 0.08
    approval_decided: 0.10
    schedule_recalculated: 0.10
    shipment_dispatched: 0.06
  lead_time_days:
    min: 5
    max: 45
  unit_price:
    min: 5.0
    max: 2500.0
  ordered_quantity:
    min: 10
    max: 5000

workflow:
  database_path: data/generated/supplier_ack.db
  output_dir: data/generated
  sample_output_dir: data/samples
  default_scale: starter
  currency: INR
  date_horizon_days: 90
  notification_channels:
    - in_app
    - email
  # Actor responsibilities are consumed by workflow routing and audit metadata.
  actor_roles:
    supplier:
      responsibilities: [acknowledgement_owner, promise_owner, quantity_change_requester]
    planner:
      responsibilities: [schedule_owner, schedule_impact_reviewer]
    carrier_warehouse_operator:
      responsibilities: [dispatch_confirmation, warehouse_receipt]
    logistics_analyst:
      responsibilities: [transit_risk_analysis, logistics_exception_owner]
    operations_manager:
      responsibilities: [exception_approver, escalation_owner]
